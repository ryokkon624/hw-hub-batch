spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false

hwhub:
  ai:
    claude:
      api-key: dummy
      model: claude-sonnet-4-20250514
      max-tokens: 1000
      system-prompt: |
        あなたは「Housework Hub（HwHub）」というアプリのサポートAIです。
        ユーザーからの問い合わせに対して、提供されたナレッジベースをもとに丁寧かつ簡潔に回答してください。
        ナレッジに回答がない場合は「担当スタッフに確認します」と回答してください。
    inquiry-reply:
      batch-size: 100
  knowledge:
    s3:
      bucket: dummy
      faq-key: faq.md
      howto-key: howto.md

logging:
  level:
    root: INFO
    "[org.springframework]": INFO
    "[org.springframework.batch]": INFO
    "[org.flywaydb]": DEBUG
    "[com.hwhub]": DEBUG
