name: coverage-batch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-batch
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Force IPv4 (workaround)
        run: echo "JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true" >> $GITHUB_ENV

      - name: Run tests & generate JaCoCo report
        run: ./gradlew test jacocoTestReport -x spotlessCheck

      - name: Verify report exists
        run: |
          ls -la build/reports/jacoco/test/html
          test -f build/reports/jacoco/test/html/index.html

      # GitHub Pages 用 artifact（deploy がこれを拾う）
      - name: Upload JaCoCo report to Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports/jacoco/test/html

      # 失敗しても確認できるように artifact は残す
      - name: Upload test report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-test-report
          path: build/reports/tests/test

      - name: Upload jacoco report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-jacoco-report
          path: build/reports/jacoco/test/html

  deploy:
    runs-on: ubuntu-latest
    needs: build-coverage
    if: ${{ success() }} # テスト落ちたら Pages には出さない（artifact は残る）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
