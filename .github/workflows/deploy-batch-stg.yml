name: deploy-batch-stg

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "564323392873"
  ECR_REPOSITORY: hwhub-batch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe がタグ履歴を参照するため fetch-depth: 0 が必須
          fetch-depth: 0

      - name: Resolve STG version (git describe)
        id: version
        run: |
          # タグが1件もない場合のフォールバック
          RAW=$(git describe --tags --long 2>/dev/null || echo "v0.0.0-0-g${GITHUB_SHA:0:7}")
          # v1.0.0-3-gabcdef1  →  v1.0.0-stg.3 に変換
          TAG=$(echo "$RAW" | sed 's/-[0-9]*-g[0-9a-f]*$//')
          DISTANCE=$(echo "$RAW" | grep -oP '(?<=-)\d+(?=-g)')
          APP_VERSION="${TAG}-stg.${DISTANCE}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved STG version: ${APP_VERSION}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::564323392873:role/gh-actions-hwhub-batch-stg
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar -x test

      - name: Normalize jar name
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*-SNAPSHOT.jar | grep -v -- '-plain\.jar$' | head -n 1)
          cp "$JAR" build/libs/app.jar

      - name: Build & Push Docker image (stg-${GITHUB_SHA} and stg-latest)
        run: |
          IMAGE_TAG_SHA="stg-${GITHUB_SHA}"
          IMAGE_URI_SHA="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}"
          IMAGE_URI_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:stg-latest"

          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.app_version }}" \
            -t "${IMAGE_URI_SHA}" \
            -t "${IMAGE_URI_LATEST}" \
            .
          docker push "${IMAGE_URI_SHA}"
          docker push "${IMAGE_URI_LATEST}"

          echo "Pushed: ${IMAGE_URI_SHA}"
          echo "Pushed: ${IMAGE_URI_LATEST}"
