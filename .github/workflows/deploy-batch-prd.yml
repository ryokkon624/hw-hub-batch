name: deploy-batch-prd

on:
  push:
    # v で始まるタグ（例: v1.0.0, v1.2.3）のみトリガー
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy tag (e.g. v1.0.0)'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "564323392873"
  ECR_REPOSITORY: hwhub-batch

  # ---- PRD環境構築後に設定 ----
  # ECS_CLUSTER: hwhub-prd
  # ECS_SERVICE: hwhub-batch-prd

jobs:
  # ----------------------------------------
  # JOB1: Build & Push to ECR
  # PRD環境未構築のため、現時点はここまで
  # ----------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PRD version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_VERSION="${{ github.event.inputs.tag }}"
          else
            APP_VERSION="${{ github.ref_name }}"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved PRD version: ${APP_VERSION}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: PRD環境構築後に PRD用IAMロールに変更
          role-to-assume: arn:aws:iam::564323392873:role/gh-actions-hwhub-batch-stg
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar -x test

      - name: Normalize jar name
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*-SNAPSHOT.jar | grep -v -- '-plain\.jar$' | head -n 1)
          cp "$JAR" build/libs/app.jar

      - name: Build & Push Docker image
        run: |
          APP_VERSION="${{ steps.version.outputs.app_version }}"
          IMAGE_URI_TAG="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:prd-${APP_VERSION}"
          IMAGE_URI_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:prd-latest"

          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            -t "${IMAGE_URI_TAG}" \
            -t "${IMAGE_URI_LATEST}" \
            .
          docker push "${IMAGE_URI_TAG}"
          docker push "${IMAGE_URI_LATEST}"

          echo "Pushed: ${IMAGE_URI_TAG}"
          echo "Pushed: ${IMAGE_URI_LATEST}"

  # ----------------------------------------
  # JOB2: ECS Deploy（Scheduler 更新）
  # TODO: PRD環境（ECSクラスター/Scheduler/IAMロール）構築後にコメントアウト解除
