name: security-scheduled-batch

# セキュリティ強化 Phase 2 / 2a（非同期の定期スキャン）。
#   - semgrep     … SAST（Java コードの静的解析）→ SARIF を code scanning へ集約
#   - secret-scan … gitleaks（git 履歴を含むシークレット検知）
#
# PR ゲートではなく schedule 起動の深掘り検知。検知は code scanning に集約し、
# トリアージ後に hw-hub-manage へ Issue 化して Sprint backlog に合流させる。
#
# 依存パッケージ（推移的依存）の脆弱性検知は、Gradle のため定期スキャンより
# **Dependabot（Settings > Code security で Dependency graph + Dependabot alerts を有効化）**
# が継続的・低コストで最適。本ワークフローでは扱わない。

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC（= 月曜 09:00 JST）
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # SARIF を code scanning にアップロードするため

jobs:
  # --- SAST（Semgrep・全コード静的解析） ----------------------------------
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep scan (SARIF)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config p/security-audit --config p/secrets --config p/java \
            --sarif --output semgrep.sarif || true

      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- シークレット混入スキャン（gitleaks・履歴含む） ----------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan, history included)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
